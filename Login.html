<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="cleaning.css">
    <style>
        :root {
            --page-color: oklab(76.759% 0.06659 0.14824);
        }

        * {
            box-sizing: border-box;
        }

        body {
            background-color: var(--page-color);
            font-family: Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            padding: 1px 16px 40px;
        }

        .background-video {
            background-color: var(--page-color);
        }

        .video-banner {
            height: clamp(180px, 35vw, 300px);
            margin: 5vh auto 28px;
            max-width: 900px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .video-banner video {
            height: 100%;
            object-fit: contain;
            width: 100%;
        }

        .login-card {
            position: relative;
            background: #ffffff00;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow:
                0px 8px 40px rgb(50, 226, 197), 5px 0px 23px rgb(71, 3, 62),
                inset 0px 0px 11px rgb(58, 243, 228);
            margin: 0 auto;
            max-width: 300px;
            padding: 48px 32px 32px;
            width: 100%;
        }

        .login-avatar {
            position: absolute;
            top: 0;
            left: 50%;
            width: 90px;
            height: 90px;
           /* image-resolution: calc(200px); */
            border-radius: 50%;
            object-fit: cover;
            transform: translate(-50%, -50%);
            box-shadow: 0 3px 10px rgba(11, 43, 131, 0.45);
           animation: spin 10s linear infinite;
        }

        .login-card h1 {
            color: #ffffff;
            font-size: 1.75rem;
            margin: 0 0 8px;
            text-align: center;
        }

        .login-card p {
            color: #000000;
            margin: 0 0 24px;
            text-align: center;
        }

        .form-field {
            margin-bottom: 18px;
            
        }

        .form-field label {
            color: #dd5805;
            display: block;
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 7px;
        }

        .form-field input {
            border: 1px solid #00000000;
            border-radius: 15px;
            font: inherit;
            min-height: 48px;
            padding: 11px 15px;
            font-family:cursive;
            width: 100%;
            background-color: #ffffff00;
            border-bottom: #f1e1e1 solid 2px;
        }

        .form-field input:focus {
            border-color: #51433b;
            outline: 3px solid rgba(81, 67, 59, 0.18);
        }

        .login-button,
        .forgot-button {
            border-radius: 8px;
            cursor: pointer;
            font: inherit;
            min-height: 48px;
            width: 100%;
        }

        .login-button {
            background: #393431;
            border: 1px solid #393431;
            color: #fff;
            font-weight: 700;
            margin-top: 4px;
        }

        .forgot-button {
            background: transparent;
            border: 0;
            color: #393431;
            margin-top: 8px;
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            body {
                display: flex;
                flex-direction: column;
                justify-content: center;
                min-height: 100vh;
                min-height: 100svh;
                padding-top: 12px;
                padding-left: 12px;
                padding-right: 12px;
                padding-bottom: 12px;
            }

            .video-banner {
                height: min(25svh, calc((100vw - 24px) * 0.5637));
                flex: 0 0 auto;
                margin: 0 auto 48px;
            }

            .login-card {
                border-radius: 12px;
                padding: 42px 20px 20px;
            }

            .login-avatar {
                width: 72px;
                height: 72px;
            }

            .login-card h1 {
                font-size: 1.5rem;
            }

            .login-card p {
                margin-bottom: 16px;
            }

            .form-field {
                margin-bottom: 12px;
            }

            .form-field input,
            .login-button,
            .forgot-button {
                min-height: 44px;
            }

            .forgot-button {
                margin-top: 4px;
            }
        }

        @media (max-width: 480px) and (max-height: 620px) {
            body {
                padding-top: 8px;
                padding-bottom: 8px;
            }

            .video-banner {
                height: min(24svh, calc((100vw - 24px) * 0.5637));
                margin-bottom: 44px;
            }

            .login-card {
                padding-top: 38px;
            }
        }
    </style>
</head>
<body>
    
    <section class="video-banner" aria-label="Welcome video">
        <video autoplay muted loop playsinline class="background-video">
            <source src="videos/Loginvideo.mp4" type="video/mp4">
        </video>
    </section>
    
        <form class="login-card" action="#" method="post">
            <img class="login-avatar" src="images/mg.jpeg" alt="Mahender Cleaning profile picture">
            <h1>Welcome back</h1>
            <p> <span style="font-weight: bolder; color: #dd0404; font-family:'Times New Roman', Times, serif; font-size: xx-large;">Propreator</span>  Sign in</p>
            <div class="form-field">
                
                <input type="text" id="username" name="username" autocomplete="username" placeholder="Enter your username" required>
            </div>
            <div class="form-field">
                
                <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Enter your password" required>
            </div>
            <button class="login-button" type="submit">Login</button>
            <button class="forgot-button" type="button">Forgot password?</button>
        </form>
    
</body>
</html>
