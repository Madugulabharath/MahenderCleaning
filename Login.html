<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Propreator - Login</title>
    <!-- <link rel="stylesheet" href="cleaning.css"> -->
    <link rel="stylesheet" href="Login.css">
    <style>
        
    </style>
</head>
<body>
    
    <section class="video-banner" aria-label="Welcome video">
        <video autoplay muted loop playsinline class="background-video">
            <source src="videos/Loginvideo.mp4" type="video/mp4">
        </video>
    </section>
<form class="login-card" id="login-form">
    <img class="login-avatar" src="images/mg.jpeg" alt="Mahender Cleaning profile picture">
    <h1>Welcome back</h1>
    <p><span style="font-weight: bolder; color: #dd0404; font-family:'Times New Roman', Times, serif; font-size: xx-large;">Proprietor</span> Sign in</p>
    <div class="form-field">
        <input type="text" id="username" name="username" autocomplete="username" placeholder="Enter your username" required>
    </div>
    <div class="form-field">
        <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Enter your password" required>
    </div>
    <button class="login-button" type="submit">Login</button>
    <button class="forgot-button" type="button">Forgot password?</button>
</form>

<script>
    document.getElementById("login-form").addEventListener("submit", (event) => {
        event.preventDefault();
        
        const userInput = document.getElementById("username").value;
        const passInput = document.getElementById("password").value;

        // Replace these with your environment variables or secure check
        // Note: For static sites on Vercel, use public build-time variables if needed, 
        // or compare against hardcoded credentials for a simple single-user admin gate.
        const validUser = "admin"; 
        const validPass = "password123";

        if (userInput === validUser && passInput === validPass) {
            // Set a session flag so they stay logged in during this browser session
            sessionStorage.setItem("isLoggedIn", "true");
            window.location.assign("Cleaningprocess.html");
        } else {
            alert("Invalid username or password");
        }
    });
</script>
    
</body>
</html>
